services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/credichain
      FRONTEND_URL: http://localhost:8080
      PUBLIC_BACKEND_URL: http://localhost:5000
      JWT_SECRET: local-dev-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-now
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data: